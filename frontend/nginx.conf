# Servidor web del TIER DE PRESENTACION.
#
# Cumple dos funciones, y conviene no confundirlas porque historicamente en
# este proyecto solo existia la segunda:
#
#   1. SERVIDOR WEB: sirve el HTML, el CSS y los modulos JavaScript del MVC.
#      Esta es la funcion que faltaba: hasta ahora el frontend no lo servia
#      nadie y habia que abrirlo desde el sistema de archivos.
#
#   2. PROXY INVERSO hacia el tier de logica bajo /api.
#
# Por que el proxy importa arquitectonicamente: hace que el navegador vea un
# UNICO origen. Sin el, el frontend tendria que apuntar a un host y puerto del
# backend escritos en el codigo, y el backend tendria que aceptar peticiones
# de cualquier origen. Con el, la ruta es relativa y no hay CORS.
#
# NOTA SOBRE ADR-10: aquel ADR elimino nginx por ser un balanceador de
# INSTANCIA UNICA, o sea un SPOF delante de componentes redundantes. Este
# servicio se despliega replicado detras del routing mesh de Swarm
# (deploy.replicas en stack.yml), asi que no reintroduce aquel problema: no
# hay una instancia unica por la que pase todo. El balanceo hacia el backend
# lo sigue haciendo el routing mesh, no este nginx.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # El resolver de Docker Swarm. Es necesario para que el nombre "backend"
    # se resuelva EN CADA PETICION contra la VIP del servicio: sin esto nginx
    # resuelve el nombre una sola vez al arrancar y se queda pegado a una IP
    # que puede dejar de existir tras un rolling upgrade.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        # ---- Funcion 1: servidor web de los estaticos del MVC ----
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Los modulos del MVC cambian con cada despliegue: no deben cachearse
        # de forma agresiva o el navegador seguiria ejecutando la version
        # anterior tras una actualizacion.
        location /src/ {
            add_header Cache-Control "no-cache";
        }

        # ---- Funcion 2: proxy inverso hacia el tier de logica ----
        location /api/ {
            # variable + resolver: fuerza la resolucion DNS en cada peticion
            set $upstream_backend backend;
            proxy_pass http://$upstream_backend:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # se propaga el correlation id que genera RequestIdFilter
            proxy_set_header X-Request-Id $http_x_request_id;

            proxy_connect_timeout 2s;
            # margen por encima del peor caso del backend (Retry + timeout de
            # Hikari, ~2.1s): si el cliente ve un error, viene del backend con
            # su cuerpo de error real, no de un 504 generado aqui.
            proxy_read_timeout 8s;
        }

        # Sonda para el HEALTHCHECK de Docker. No toca el backend a proposito:
        # responde por la salud de ESTE tier, no la del de logica. Si mezclara
        # ambas, una caida del backend sacaria de rotacion a los servidores
        # web, que es justo lo contrario de lo que se quiere (ADR-03).
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
