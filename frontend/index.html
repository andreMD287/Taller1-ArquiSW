<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Autenticación de Usuarios</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="login-container">

        <h1>Iniciar sesión</h1>

        <form id="loginForm">

            <label for="username">Usuario</label>
            <!-- el atributo name no es decorativo: es como la vista localiza
                 el input al que apunta cada violacion del backend -->
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Nombre de usuario"
                required
            >

            <label for="password">Contraseña</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Contraseña"
                required
            >

            <button type="submit">
                Iniciar sesión
            </button>

        </form>

        <p id="message"></p>

    </main>

    <!-- type="module" habilita import/export nativos del navegador: la
         separacion modelo/vista/controlador vive en archivos separados sin
         necesidad de un empaquetador ni de un paso de build -->
    <script type="module" src="src/app.js"></script>

</body>
</html>
