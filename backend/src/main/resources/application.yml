# Configuracion base. Los perfiles (docker, test) solo sobreescriben lo que
# cambia por entorno: mismo artefacto en todos lados, nunca recompilar (Cap. 5).
spring:
  application:
    name: auth
  datasource:
    url: jdbc:postgresql://localhost:5433/authdb
    username: postgres
    password: postgres
    hikari:
      # timeouts cortos a proposito: si Postgres esta caido, el pool falla en
      # ~1s en vez de en los 30s por defecto. Con Retry (2 intentos) el peor
      # caso queda por debajo del proxy_read_timeout de nginx (8s), asi el
      # cliente recibe un 503/degraded real en vez de un 504 de nginx.
      connection-timeout: 1000
      validation-timeout: 1000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    web:
      pageable:
        # tope duro al tamano de pagina: sin el, un cliente puede pedir
        # ?size=100000 y hacer que una sola peticion incumpla el objetivo de
        # rendimiento de <2s. El default de Spring (2000) es demasiado alto
        # para las consultas de listado de este sistema.
        default-page-size: 20
        max-page-size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
  lifecycle:
    # da tiempo a que las peticiones en vuelo terminen antes de matar el proceso:
    # sin esto un rolling upgrade corta conexiones a mitad de respuesta.
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  # apagado ordenado (graceful): deja de aceptar peticiones nuevas pero termina
  # las que ya estan en curso antes de cerrar el puerto.
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        # el dataTier SOLO entra en readiness, nunca en liveness (ver
        # DataTierHealthIndicator): evita reinicios en cascada si Postgres cae.
        readiness:
          include: readinessState,dataTier
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      node: ${node.id}

resilience4j:
  circuitbreaker:
    instances:
      dataTier:
        sliding-window-size: 10
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # CRITICO: sin esto, el circuit breaker trata CUALQUIER excepcion (una
        # password incorrecta, un usuario duplicado) como una falla del tier de
        # datos y la enruta al fallback como si fuera un 503. AppException
        # cubre todo lo EXPECTED (Cap. 4): eso nunca debe contar como fallo ni
        # pasar por el fallback, debe llegar tal cual al GlobalExceptionHandler.
        ignore-exceptions:
          - com.taller.auth.exception.AppException
  retry:
    instances:
      # solo para operaciones IDEMPOTENTES de lectura contra el tier de datos.
      # un INSERT no idempotente nunca debe vivir detras de este retry.
      dataTier:
        max-attempts: 2
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.dao.QueryTimeoutException
          - org.springframework.dao.DataAccessResourceFailureException
        # misma razon que en el circuit breaker: una sesion invalida (EXPECTED)
        # no debe disparar reintentos ni el fallback de degradacion.
        ignore-exceptions:
          - com.taller.auth.exception.AppException

# Configuracion propia del dominio de autenticacion.
app:
  lockout:
    max-attempts: 5
    lockout-seconds: 60
  jwt:
    # vacio a proposito: TokenService decide que hacer segun el perfil activo
    # (ver TokenService.resolveSecret). En el perfil "docker" es obligatorio.
    secret: ${JWT_SECRET:}
    # TTL corto a proposito (Fase 1): limita la ventana en la que un JWT
    # robado sigue siendo valido, ya que no se puede revocar antes de expirar.
    access-ttl-seconds: ${JWT_TTL_SECONDS:900}
    # 7 dias: el refresh token si es revocable (vive en BD), asi que puede
    # tener una vida mucho mas larga sin el mismo riesgo.
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}
    # la purga de refresh tokens ya NO esta en el camino critico de ninguna
    # peticion (a diferencia de la purga de sesiones que existia antes), asi
    # que puede correr con un intervalo relajado.
    purge-interval-ms: 3600000

    cors:
    allowed-origins:
      - http://localhost:8123
      - http://127.0.0.1:8123

# Feature toggles: desacoplan el despliegue del release (Cap. 5).
features:
  new-dashboard: false
  # Toggles de reglas de negocio de producto (ADR-005). Convencion: una regla
  # nueva se anota con
  #   @ConditionalOnProperty(name = "features.rules.<nombre>", havingValue = "true")
  # y se lista aqui. Apagada, la regla NO llega a instanciarse como bean: no
  # cuesta nada en ejecucion, a diferencia de un if dentro del metodo.
  #
  # Las reglas centrales (precio > 0, stock >= 0) NO son toggleables a
  # proposito: son invariantes del negocio, no funcionalidad en despliegue
  # progresivo. Un toggle que permita apagar "el stock no puede ser negativo"
  # es un agujero de safety, no flexibilidad.
  rules: {}

node:
  # identifica el nodo/replica en logs y metricas. Si NODE_ID no esta seteado
  # (Swarm, en vez de fijarlo a mano por replica) cae al HOSTNAME del
  # contenedor, que en stack.yml se templa como "backend-{{.Task.Slot}}":
  # cada tarea de Swarm queda identificada sin hardcodear nada por replica.
  id: ${NODE_ID:${HOSTNAME:local}}

logging:
  level:
    root: INFO
    com.taller.auth: DEBUG
