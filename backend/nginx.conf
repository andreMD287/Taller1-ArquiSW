# BALANCEADOR DEL CAMINO HEREDADO (docker-compose.yml, v1.0).
#
# NO CONFUNDIR con frontend/nginx.conf, que es el SERVIDOR WEB del tier de
# presentacion en el despliegue real (stack.yml). Son dos nginx con papeles
# distintos:
#
#   - este archivo  -> balancea entre backend-1 y backend-2 en el compose de
#                      desarrollo local. En Swarm ese papel lo cumple el
#                      routing mesh, y por eso ADR-10 lo elimino del
#                      despliegue real.
#   - frontend/     -> sirve el MVC del frontend y hace proxy de /api. Va
#                      replicado, asi que no es una instancia unica.
#
# Este archivo solo sigue vivo porque docker-compose.yml sigue siendo un
# atajo util para iterar en el backend sin levantar el cluster completo.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # max_fails/fail_timeout: nginx saca un nodo de la rotacion tras N fallos
    # consecutivos sin esperar a que Docker lo reinicie. Es la mitad visible
    # de "Redundant Spare (active)": la otra mitad es que hay 2 replicas.
    upstream auth_backend {
        server backend-1:8080 max_fails=2 fail_timeout=10s;
        server backend-2:8080 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://auth_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Id $http_x_request_id;

            # si el nodo elegido no responde, nginx reintenta en el otro de
            # inmediato: el cliente nunca ve el 502 de una replica caida sola.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 2s;
            # margen de seguridad sobre el peor caso de Retry+timeout de Hikari
            # (~2.1s): si esto se cumple, el 503/degraded viene del backend,
            # nunca de un 504 de nginx.
            proxy_read_timeout 8s;
        }
    }
}
