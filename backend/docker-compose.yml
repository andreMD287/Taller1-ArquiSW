services:
  postgres:
    image: postgres:16-alpine
    container_name: auth-postgres
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d authdb"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - auth-net

  # backend-1 y backend-2 comparten la MISMA imagen (auth-backend:latest):
  # solo cambia NODE_ID. Es la base de "mismo artefacto en todos lados"
  # (Cap. 5) y de la tactica "Redundant Spare (active)" (Cap. 4).
  backend-1:
    build: .
    image: auth-backend:latest
    container_name: backend-1
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NODE_ID: backend-1
      POSTGRES_DB: authdb
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      # default de conveniencia para que "docker compose up" siga siendo un
      # solo comando para el evaluador; exporta JWT_SECRET antes de levantar
      # si necesitas un secreto propio. En Swarm (Fase 2) esto se reemplaza
      # por un docker secret real, nunca por una variable de entorno plana.
      JWT_SECRET: ${JWT_SECRET:-taller-arquisw-dev-secret-cambiar-en-produccion-32bytes}
    ports:
      # puerto directo (sin pasar por nginx) para que los scripts de
      # despliegue puedan consultar el readiness de ESTE nodo puntualmente.
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - auth-net

  backend-2:
    build: .
    image: auth-backend:latest
    container_name: backend-2
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NODE_ID: backend-2
      POSTGRES_DB: authdb
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      JWT_SECRET: ${JWT_SECRET:-taller-arquisw-dev-secret-cambiar-en-produccion-32bytes}
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - auth-net

  nginx:
    image: nginx:1.27-alpine
    container_name: auth-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
    networks:
      - auth-net

networks:
  auth-net:
    driver: bridge

volumes:
  pgdata:
