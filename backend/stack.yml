version: "3.8"

# ADR: Docker Swarm en vez de Kubernetes o del docker-compose.yml de
# desarrollo. Este archivo es EL MISMO para el evaluador (1 nodo) y para la
# demo de alta disponibilidad (N nodos): "docker stack deploy -c stack.yml"
# no cambia con la topologia. Resuelve el conflicto entre los dos atributos
# de calidad exigidos -alta disponibilidad y despliegue sencillo- sin exigir
# un cluster multi-nodo para poder evaluar el entregable.
#
# Lo que Swarm aporta nativamente sobre el docker-compose.yml anterior:
# - routing mesh: reemplaza a nginx como balanceador. Ya no hay una unica
#   instancia de balanceador que sea un SPOF.
# - reprogramacion automatica de tareas caidas (Reconfiguration, Cap. 4):
#   nadie corre "docker compose up" a mano cuando un nodo muere.
# - rolling update con healthcheck y rollback automatico (ver
#   backend.deploy.update_config): Removal from Service + Redundant Spare
#   (Cap. 4), declarativo en vez de orquestado por rolling-upgrade.sh a mano.
#
# Swarm NO soporta "depends_on" con condiciones de arranque (a diferencia de
# docker-compose): por diseno, el backend debe tolerar que Postgres no este
# listo todavia al arrancar. Eso ya lo cubren el Retry/CircuitBreaker de
# ResilienceConfig, asi que no hace falta orquestar el orden de arranque.
#
# FASE 4 (refuerzo, no requisito): Postgres deja de ser una instancia unica.
# 3 nodos con repmgr (bitnamilegacy/postgresql-repmgr: Bitnami retiro las
# imagenes "latest" gratuitas de postgresql-repmgr de su namespace normal a
# mediados de 2025; "bitnamilegacy" es donde quedaron las ultimas versiones
# publicas sin subscripcion) hacen eleccion de lider y promocion automatica
# de un standby si el primario muere. Lo que le importa
# al modelo de disponibilidad no es la redundancia en si, sino el MTTR: sin
# esto, recuperar Postgres es intervencion manual (~1h, el escenario del
# enunciado original); con repmgrd corriendo, la promocion es automatica en
# el orden de segundos (medido por scripts/chaos-db-failover.sh). Con la
# Fase 1 ya en pie, Postgres solo esta en el camino critico del 5% del
# trafico (login), asi que el objetivo de 99.99% se cumple CON o SIN esta
# fase (ver Fase 3); esto es lo que lleva ese 5% de 99.9% a 99.999%.
#
# No es Kubernetes: en Swarm no existe el equivalente a un StatefulSet con
# volumenes por replica, asi que cada nodo es un SERVICIO propio (no
# "replicas: 3" de un solo servicio) con su propio volumen. Limitacion
# conocida y documentada: los volumenes "local" son del nodo donde corren;
# si un nodo NO-manager muere, ese slot pierde sus datos locales y necesita
# re-aprovisionarse (repmgr no arregla la perdida de disco, solo la caida
# del proceso/contenedor). Cubrir eso de verdad pide almacenamiento
# distribuido (NFS/EBS/CSI), fuera del alcance de un MVP de taller.
x-postgres-repmgr-env: &postgres-repmgr-env
  POSTGRESQL_POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
  POSTGRESQL_USERNAME: auth
  POSTGRESQL_PASSWORD_FILE: /run/secrets/postgres_password
  POSTGRESQL_DATABASE: authdb
  REPMGR_PASSWORD_FILE: /run/secrets/repmgr_password
  REPMGR_PARTNER_NODES: postgres-1,postgres-2,postgres-3
  REPMGR_PRIMARY_HOST: postgres-1
  REPMGR_PORT_NUMBER: "5432"

x-postgres-repmgr-secrets: &postgres-repmgr-secrets
  - postgres_superuser_password
  - postgres_password
  - repmgr_password

x-postgres-repmgr-healthcheck: &postgres-repmgr-healthcheck
  # PGPASSWORD no lee _FILE (eso es una convencion de las imagenes de
  # Bitnami/Postgres para SUS entrypoints, no de libpq/psql): el password
  # hay que leerlo del secret a mano en el propio comando del healthcheck.
  # $$ (no $): "docker stack deploy" interpola $ como variable de Compose,
  # hay que escaparlo para que el shell del contenedor vea un solo $.
  test: ["CMD-SHELL", "PGPASSWORD=$$(cat /run/secrets/postgres_password) psql -h 127.0.0.1 -U auth -d authdb -c 'select 1' > /dev/null"]
  interval: 10s
  timeout: 5s
  # start_period generoso: el bootstrap del cluster (clonar desde el
  # primario via pg_basebackup) tarda mas que el arranque de un Postgres
  # normal, sobre todo para postgres-2/postgres-3.
  start_period: 60s
  retries: 6

services:
  postgres-1:
    image: bitnamilegacy/postgresql-repmgr:16-debian-12
    hostname: postgres-1
    environment:
      <<: *postgres-repmgr-env
      REPMGR_NODE_NAME: postgres-1
      REPMGR_NODE_NETWORK_NAME: postgres-1
    secrets: *postgres-repmgr-secrets
    healthcheck: *postgres-repmgr-healthcheck
    volumes:
      - pgdata1:/bitnami/postgresql
    networks:
      - auth-net
    deploy:
      replicas: 1
      placement:
        preferences:
          - spread: node.hostname
      restart_policy:
        condition: any

  postgres-2:
    image: bitnamilegacy/postgresql-repmgr:16-debian-12
    hostname: postgres-2
    environment:
      <<: *postgres-repmgr-env
      REPMGR_NODE_NAME: postgres-2
      REPMGR_NODE_NETWORK_NAME: postgres-2
    secrets: *postgres-repmgr-secrets
    healthcheck: *postgres-repmgr-healthcheck
    volumes:
      - pgdata2:/bitnami/postgresql
    networks:
      - auth-net
    deploy:
      replicas: 1
      placement:
        preferences:
          - spread: node.hostname
      restart_policy:
        condition: any

  postgres-3:
    image: bitnamilegacy/postgresql-repmgr:16-debian-12
    hostname: postgres-3
    environment:
      <<: *postgres-repmgr-env
      REPMGR_NODE_NAME: postgres-3
      REPMGR_NODE_NETWORK_NAME: postgres-3
    secrets: *postgres-repmgr-secrets
    healthcheck: *postgres-repmgr-healthcheck
    volumes:
      - pgdata3:/bitnami/postgresql
    networks:
      - auth-net
    deploy:
      replicas: 1
      placement:
        preferences:
          - spread: node.hostname
      restart_policy:
        condition: any

  backend:
    image: auth-backend:latest
    # Swarm templa el hostname por tarea (backend-1, backend-2, backend-3...):
    # es la fuente del NODE_ID que aparece en logs/metricas, sin hardcodear
    # nada por replica (ver application.yml: node.id cae a $HOSTNAME).
    hostname: "backend-{{.Task.Slot}}"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_DB: authdb
      POSTGRES_USER: auth
      # los 3 nodos del cluster: el driver JDBC prueba cada uno y se queda
      # con el que responda como primario (ver application-docker.yml). Sin
      # esto el backend seguiria intentando conectar a un solo host fijo,
      # que puede haber dejado de ser el primario tras un failover.
      POSTGRES_HOSTS: postgres-1:5432,postgres-2:5432,postgres-3:5432
    secrets:
      - jwt_secret
      - postgres_password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/liveness"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3
    ports:
      # modo ingress (default): el routing mesh de Swarm balancea entre
      # TODAS las replicas sanas del servicio desde cualquier nodo del
      # cluster. Sustituye por completo a nginx.
      - target: 8080
        published: 8080
        protocol: tcp
        mode: ingress
    networks:
      - auth-net
    deploy:
      replicas: 3
      # reparte las replicas entre los nodos disponibles; con 1 solo nodo
      # (evaluador) las 3 caen ahi igual. Redundant Spare (active), Cap. 4.
      placement:
        preferences:
          - spread: node.hostname
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 30s
        delay: 5s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: any

networks:
  auth-net:
    driver: overlay

volumes:
  pgdata1:
  pgdata2:
  pgdata3:

secrets:
  # creados por scripts/deploy.sh antes del "stack deploy" (docker secret
  # create); "external: true" le dice a Swarm que no los genere, que ya
  # deben existir. Nunca viajan como variable de entorno plana en este
  # archivo (a diferencia de docker-compose.yml, pensado solo para dev local).
  jwt_secret:
    external: true
  postgres_password:
    external: true
  # nuevos en la Fase 4: superusuario de Postgres y usuario interno de
  # repmgr para la replicacion/eleccion de lider.
  postgres_superuser_password:
    external: true
  repmgr_password:
    external: true
